version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: splitpay_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=splitpay
    ports:
      - "5433:5432" # Używamy 5433 na hoście, żeby nie gryzło się z lokalnym Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: splitpay_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@db:5432/splitpay?schema=public
      - JWT_SECRET=your_super_secret_jwt_key_here
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: splitpay_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true # [Realizm: Fix dla Vite HMR w środowisku Docker Windows/WSL/MacOS]
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
